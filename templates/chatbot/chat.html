<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheatBot AI Assistant</title>
    <style>
        :root {
            --primary-bg: #343541;
            --sidebar-bg: #202123;
            --message-bot-bg: #444654;
            --message-user-bg: #343541;
            --border-color: #4d4d4f;
            --text-primary: #ececf1;
            --text-secondary: #acacbe;
            --accent-color: #10a37f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .new-chat-btn {
            margin: 12px;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #0d906b;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-history-item {
            padding: 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .chat-history-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--primary-bg);
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--primary-bg);
        }

        .message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            max-width: 100%;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--accent-color);
            color: white;
        }

        .message.bot .message-avatar {
            background: #565869;
            color: var(--text-primary);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-text {
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-text {
            background: var(--message-user-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
        }

        .message.bot .message-text {
            background: var(--message-bot-bg);
            border-radius: 8px;
            padding: 12px 16px;
        }

        /* Input Area */
        .input-container {
            padding: 24px;
            background: var(--primary-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }

        .message-input {
            width: 100%;
            min-height: 56px;
            max-height: 200px;
            padding: 16px 48px 16px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            resize: none;
            font-size: 15px;
            line-height: 1.5;
            background: #40414f;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .message-input:focus {
            border-color: var(--accent-color);
            background: #40414f;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .send-button {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 32px;
            height: 32px;
            background: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-button:hover {
            background: #0d906b;
        }

        .send-button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="newChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M12 4V20M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                New Chat
            </button>
            
            <div class="chat-history">
                <!-- Chat history items will be populated here -->
            </div>
            
            <div class="sidebar-footer">
                CheatBot v1.0
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="chat-header">
                <h1>CheatBot AI Assistant</h1>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="message bot">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-text">
                            Hello! I'm CheatBot, your AI assistant. How can I help you today?
                        </div>
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Message CheatBot..." 
                        rows="1"
                    ></textarea>
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function newChat() {
            document.getElementById('messagesContainer').innerHTML = `
                <div class="message bot">
                    <div class="message-avatar">AI</div>
                    <div class="message-content">
                        <div class="message-text">
                            Hello! I'm CheatBot, your AI assistant. How can I help you today?
                        </div>
                    </div>
                </div>
            `;
        }
        // Global variables for streaming management
let currentStreamingElement = null;
let currentFullResponse = '';

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const message = input.value.trim();
    
    if (!message) return;
    
    // Add user message to UI
    addMessage(message, 'user');
    input.value = '';
    
    // Show typing indicator
    showTyping();
    
    try {
        const messagesContainer = document.getElementById('messagesContainer');
        
        // If there's an existing streaming element, complete it
        if (currentStreamingElement) {
            currentStreamingElement = null;
            currentFullResponse = '';
        }
        
        // Create a NEW message element for this response
        const messageId = 'streaming_msg_' + Date.now();
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';
        botMessageDiv.innerHTML = `
            <div class="message-avatar">AI</div>
            <div class="message-content">
                <div class="message-text" id="${messageId}"></div>
            </div>
        `;
        messagesContainer.appendChild(botMessageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        // Set this as the current streaming element
        currentStreamingElement = document.getElementById(messageId);
        currentFullResponse = '';
        
        // Use Fetch API with streaming
        const response = await fetch('/api/send-message/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message: message })
        });
        
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
            const { done, value } = await reader.read();
            
            if (done) {
                hideTyping();
                // Streaming complete - clear current element for next message
                currentStreamingElement = null;
                currentFullResponse = '';
                break;
            }
            
            // Decode the chunk
            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split('\n');
            
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6); // Remove 'data: ' prefix
                    
                    if (data === '[DONE]') {
                        hideTyping();
                        console.log('✅ Stream complete');
                        currentStreamingElement = null;
                        currentFullResponse = '';
                        return;
                    }
                    
                    try {
                        const parsed = JSON.parse(data);
                        
                        if (parsed.error) {
                            if (currentStreamingElement) {
                                currentStreamingElement.textContent = parsed.error;
                            }
                            hideTyping();
                            currentStreamingElement = null;
                            return;
                        }
                        
                        if (parsed.chunk && currentStreamingElement) {
                            currentFullResponse += parsed.chunk;
                            currentStreamingElement.textContent = currentFullResponse;
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }
                    } catch (e) {
                        console.error('Error parsing stream data:', e);
                    }
                }
            }
        }
        
    } catch (error) {
        hideTyping();
        // Update current streaming element with error
        if (currentStreamingElement) {
            currentStreamingElement.textContent = 'Sorry, I encountered an error. Please try again.';
            currentStreamingElement = null;
        }
        console.error('API Error:', error);
    }
}
        function addMessage(text, sender) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${sender === 'user' ? 'You' : 'AI'}</div>
                <div class="message-content">
                    <div class="message-text">${text}</div>
                </div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'flex';
            document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        // Enter key support
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
